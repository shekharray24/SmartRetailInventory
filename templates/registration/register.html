{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
body{

    margin:0;

    padding:0;

    font-family:'Segoe UI',sans-serif;

    background:linear-gradient(135deg,#183642,#21495b);

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

}

.register-card{

    width:450px;

    background:#314753;

    padding:30px;

    border-radius:18px;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.register-card h2{

    text-align:center;

    color:white;

    margin-bottom:25px;

    font-weight:700;

}

label{

    color:white;

    font-weight:500;

    margin-bottom:6px;

}

.form-control{

    height:44px;

    border-radius:10px;

    border:none;

    margin-bottom:12px;

}

.form-control:focus{

    box-shadow:0 0 8px #22c55e;

}

.btn-register{

    width:100%;

    height:46px;

    border-radius:10px;

    font-size:17px;

    font-weight:600;

    margin-top:8px;

}

.bottom-link{

    text-align:center;

    margin-top:18px;

    color:white;

}

.bottom-link a{

    color:#22c55e;

    text-decoration:none;

    font-weight:600;

}

.bottom-link a:hover{

    text-decoration:underline;

}

.alert{

    padding:10px;

    font-size:14px;

}
    </style>

</head>

<body>

    <div class="register-card">

        <h2>📝 Create Account</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Full Name</label>

            {{ form.first_name }}

            <label>Username</label>

            {{ form.username }}

            <label>Email Address</label>

            {{ form.email }}

            <label>Password</label>

            {{ form.password }}

            <label>Confirm Password</label>

            {{ form.confirm_password }}

            {% if form.errors %}

            <div class="alert alert-danger">

                {{ form.errors }}

            </div>

            {% endif %}

            <button class="btn btn-success btn-register">

                <i class="bi bi-person-plus-fill"></i>

                Create Account

            </button>

        </form>

        <div class="bottom-link">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </div>

    </div>

</body>

</html>
