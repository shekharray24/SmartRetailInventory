{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#163542,#21495b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .forgot-card{

            width:430px;
            background:#324852;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.35);
            color:white;

        }

        .icon{

            text-align:center;
            font-size:60px;
            color:#ffc107;
            margin-bottom:15px;

        }

        h2{

            text-align:center;
            font-weight:700;
            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;
            color:#d1d5db;
            font-size:15px;
            margin-bottom:25px;

        }

        label{

            font-weight:600;
            margin-bottom:8px;

        }

        input{

            width:100%;
            height:48px;
            border:none;
            border-radius:10px;
            padding:12px;
            margin-top:6px;
            margin-bottom:18px;

        }

        input:focus{

            outline:none;
            box-shadow:0 0 8px rgba(255,193,7,.5);

        }

        .btn-send{

            width:100%;
            height:48px;
            border-radius:10px;
            font-size:17px;
            font-weight:600;

        }

        .back-link{

            text-align:center;
            margin-top:20px;

        }

        .back-link a{

            color:#22c55e;
            text-decoration:none;
            font-weight:600;

        }

        .back-link a:hover{

            text-decoration:underline;

        }

        .alert{

            font-size:14px;

        }

    </style>

</head>

<body>

<div class="forgot-card">

    <div class="icon">

        <i class="bi bi-envelope-lock-fill"></i>

    </div>

    <h2>Forgot Password</h2>

    <p class="subtitle">

        Enter your registered email address.<br>

        We'll generate a password reset link.

    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Email Address</label>

        {{ form.email }}

        {% if form.errors %}

        <div class="alert alert-danger">

            {{ form.errors }}

        </div>

        {% endif %}

        <button class="btn btn-warning btn-send">

            <i class="bi bi-send-fill"></i>

            Send Reset Link

        </button>

    </form>

    <div class="back-link">

        <a href="{% url 'login' %}">

            <i class="bi bi-arrow-left"></i>

            Back to Login

        </a>

    </div>

</div>

</body>

</html>
