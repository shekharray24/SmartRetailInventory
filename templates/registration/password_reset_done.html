{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Sent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#163542,#21495b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .success-card{

            width:450px;
            background:#324852;
            border-radius:18px;
            padding:40px;
            text-align:center;
            color:white;
            box-shadow:0 15px 35px rgba(0,0,0,.35);

        }

        .success-icon{

            font-size:70px;
            color:#22c55e;
            margin-bottom:20px;

        }

        h2{

            font-weight:700;
            margin-bottom:15px;

        }

        p{

            color:#d1d5db;
            line-height:1.7;
            margin-bottom:25px;

        }

        .btn-login{

            width:100%;
            height:48px;
            border-radius:10px;
            font-size:17px;
            font-weight:600;

        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">

        <i class="bi bi-envelope-check-fill"></i>

    </div>

    <h2>Password Reset Link Sent</h2>

    <p>

        A password reset link has been generated successfully.

        <br><br>

        <strong>Development Mode:</strong>

        Since this project is using the Django Console Email Backend,

        please check your VS Code terminal and copy the reset link displayed there.

    </p>

    <a href="{% url 'login' %}" class="btn btn-success btn-login">

        <i class="bi bi-arrow-left-circle-fill"></i>

        Back to Login

    </a>

</div>

</body>

</html>
